# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: "en"
early_access: false
reviews:
  profile: "chill"
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  review_status: true
  collapse_walkthrough: true
  path_filters:
    - "!web/node_modules/**"
    - "!server/bin/**"
    - "!server/internal/web/dist/**"
    - "!web/dist/**"
  path_instructions:
    - path: "server/**/*.go"
      instructions: "Review the Golang code for conformity with the Uber Golang style guide, highlighting any deviations."
    - path: "server/**/*_test.go"
      instructions: |
        "Assess the unit test code assessing sufficient code coverage for the changes associated in the pull request"
    - path: "web/src/**/*.{ts,tsx}"
      instructions: |
        "Review the TypeScript and React code for type safety, hook correctness, and accessibility. Flag any component that bypasses the shared shadcn/ui primitives or duplicates existing API layers."
    - path: "**/*.md"
      instructions: |
        "Assess the documentation for misspellings, grammatical errors, missing documentation and correctness"
  auto_review:
    enabled: true
    ignore_title_keywords:
      - "WIP"
      - "DO NOT MERGE"
      - "DRAFT"
    drafts: false
    base_branches:
      - "main"
      - "dev"
chat:
  auto_reply: true
