services:
  postgres:
    image: postgres:18-alpine
    container_name: govi-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: govi
    ports:
      - "5432:5432"
    volumes:
      - govi-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d govi"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  govi-pgdata:
